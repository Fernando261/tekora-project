name: MySQL 8.4 foundation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mysql-v81:
    name: MySQL 8.4 / InnoDB foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/tekora-mysql-v81.XXXXXXXX")
          printf '%s\n' 'MySQL V8.1 evidence' > "$directory/preparation.log"
          echo "MYSQL_V81_EVIDENCE=$directory" >> "$GITHUB_ENV"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:2.8.12
          coverage: none

      - name: Install locked development dependencies
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e .env.testing
          test ! -e bootstrap/cache/config.php
          test ! -e database/database.sqlite
          printf 'head=%s\n' "$PR_HEAD" | tee -a "$MYSQL_V81_EVIDENCE/preparation.log"
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins 2>&1 \
            | tee -a "$MYSQL_V81_EVIDENCE/preparation.log"

      - name: Run isolated MySQL installation, suite and restart
        run: |
          set -euo pipefail
          bash -n tools/mysql-v81/run.sh
          docker build --tag tekora-v81-lab-php:8.4.27 tools/mysql-v81 2>&1 | tee "$MYSQL_V81_EVIDENCE/image-build.log"
          bash tools/mysql-v81/run.sh "$MYSQL_V81_EVIDENCE/lab" 2>&1 | tee "$MYSQL_V81_EVIDENCE/runner.log"

      - name: Verify JUnit, source and cleanup
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          test -z "$(docker ps -aq --filter label=tekora.v81.lab)"
          test -z "$(docker volume ls -q --filter label=tekora.v81.lab)"
          python3 - "$MYSQL_V81_EVIDENCE/lab" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(sys.argv[1])
          for name, minimum in [('mysql-junit.xml', 14), ('mysql-restart-junit.xml', 1)]:
              suite = ET.parse(root / name).getroot().find('testsuite')
              if suite is None:
                  sys.exit(f'{name}: missing PHPUnit suite')
              tests = int(suite.attrib['tests'])
              cases = suite.findall('.//testcase')
              if tests < minimum or tests != len(cases) or any(
                  suite.attrib[key] != '0' for key in ('errors', 'failures', 'skipped')
              ) or any(int(case.attrib['assertions']) < 1 for case in cases):
                  sys.exit(f'{name}: incomplete or unsuccessful execution')
              print(f"{name}: {tests} tests, {suite.attrib['assertions']} assertions, zero skips")
          PY

      - name: Preserve logs and JUnit
        if: always() && env.MYSQL_V81_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mysql-v81-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MYSQL_V81_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
