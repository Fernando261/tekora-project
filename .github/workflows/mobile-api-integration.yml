name: Mobile API integration

on:
  pull_request:
    branches: [main, codex/v810-integrated-simulated-checkout]
    paths:
      - '.github/workflows/mobile-api-integration.yml'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'tests/**'
      - 'docs/api/openapi.json'
      - 'composer.*'
      - 'package*.json'
      - 'phpunit.xml'

permissions:
  contents: read

jobs:
  mobile-api:
    name: Mobile API / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install locked dependencies and build assets
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.testing
          test ! -e database/database.sqlite
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build

      - name: Run clean-install, mobile journey and compatibility tests
        run: |
          php vendor/bin/phpunit --do-not-cache-result --log-junit "$RUNNER_TEMP/tekora-api.xml" \
            --filter 'Mobile(CleanInstallation|IntegrationJourney|ApiAuth|ApiCatalog|CatalogDashboard|IdentityProfile|OperationsContract|OperationsConcurrency|ContactPrivacy|Notifications|NotificationConcurrency|Reviews|QuotesApi|QuoteConcurrency|CheckoutHandoffContract|ConfirmationReadiness|SyntheticCheckoutApi)Test|ReservationHold(ApiAndGuards|Concurrency)Test|ReviewConcurrencyTest|ContractingJourneyTest|LocalIntegratedCheckoutHttpTest|ProfessionalTrustTest|PublicCatalogTest'


      - name: Preserve PHPUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tekora-api-php-${{ matrix.php }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tekora-api.xml
          if-no-files-found: ignore
