# Candidate config. Install only after local smoke/backup approval.
server {
    listen 127.0.0.1:8083 default_server;
    server_name _;
    return 421;
}

server {
    listen 127.0.0.1:8083;
    server_name tekora.mx;
    root /srv/tekora/current/public;
    index index.php;
    server_tokens off;
    client_max_body_size 8m;

    # The vhost is reachable only from local processes and the existing HTTPS tunnel.
    # Do not trust client-supplied Forwarded/X-Forwarded-* or CF-Connecting-IP.
    location = /_tekora/origin-health {
        access_log off;
        return 204;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PREFIX "";
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) { return 404; }
    location ~ (?:^|/)\. { return 404; }
    location ^~ /storage/private/ { return 404; }
    location = /demo/checkout { return 404; }
    location ~ ^/api/v1/reservations/[^/]+/demo-checkout(?:/|$) { return 404; }
}
